<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030712"/>
      <stop offset="100%" style="stop-color:#0f0a1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff08" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow orbs -->
  <circle cx="200" cy="200" r="200" fill="#7c3aed" opacity="0.08"/>
  <circle cx="1000" cy="430" r="180" fill="#a855f7" opacity="0.06"/>

  <!-- Logo icon -->
  <rect x="80" y="72" width="52" height="52" rx="12" fill="url(#accent)"/>
  <text x="106" y="106" font-family="Arial" font-size="28" font-weight="bold" fill="white" text-anchor="middle">⚡</text>

  <!-- Brand name -->
  <text x="148" y="108" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="white">form</text>
  <text x="232" y="108" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#a855f7">ly</text>

  <!-- Main headline -->
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="white">29 Free AI Tools</text>
  <text x="80" y="295" font-family="Arial, sans-serif" font-size="42" font-weight="600" fill="#9ca3af">for Professionals</text>

  <!-- Accent bar -->
  <rect x="80" y="330" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- Tool pills row 1 -->
  <rect x="80" y="368" width="220" height="40" rx="20" fill="#1f1f2e" stroke="#374151" stroke-width="1"/>
  <text x="190" y="394" font-family="Arial, sans-serif" font-size="16" fill="#d1d5db" text-anchor="middle">Pay Stub Generator</text>

  <rect x="316" y="368" width="178" height="40" rx="20" fill="#1f1f2e" stroke="#374151" stroke-width="1"/>
  <text x="405" y="394" font-family="Arial, sans-serif" font-size="16" fill="#d1d5db" text-anchor="middle">Resume Builder</text>

  <rect x="510" y="368" width="200" height="40" rx="20" fill="#1f1f2e" stroke="#374151" stroke-width="1"/>
  <text x="610" y="394" font-family="Arial, sans-serif" font-size="16" fill="#d1d5db" text-anchor="middle">PDF Summarizer</text>

  <rect x="726" y="368" width="176" height="40" rx="20" fill="#1f1f2e" stroke="#374151" stroke-width="1"/>
  <text x="814" y="394" font-family="Arial, sans-serif" font-size="16" fill="#d1d5db" text-anchor="middle">Grammar Checker</text>

  <!-- Tool pills row 2 -->
  <rect x="80" y="424" width="160" height="40" rx="20" fill="#1f1f2e" stroke="#374151" stroke-width="1"/>
  <text x="160" y="450" font-family="Arial, sans-serif" font-size="16" fill="#d1d5db" text-anchor="middle">Paraphraser</text>

  <rect x="256" y="424" width="200" height="40" rx="20" fill="#1f1f2e" stroke="#374151" stroke-width="1"/>
  <text x="356" y="450" font-family="Arial, sans-serif" font-size="16" fill="#d1d5db" text-anchor="middle">Contract Generator</text>

  <rect x="472" y="424" width="168" height="40" rx="20" fill="#1f1f2e" stroke="#374151" stroke-width="1"/>
  <text x="556" y="450" font-family="Arial, sans-serif" font-size="16" fill="#d1d5db" text-anchor="middle">Email Writer</text>

  <rect x="656" y="424" width="180" height="40" rx="20" fill="#1f1f2e" stroke="#374151" stroke-width="1"/>
  <text x="746" y="450" font-family="Arial, sans-serif" font-size="16" fill="#d1d5db" text-anchor="middle">Code Reviewer</text>

  <rect x="852" y="424" width="116" height="40" rx="20" fill="#7c3aed20" stroke="#7c3aed60" stroke-width="1"/>
  <text x="910" y="450" font-family="Arial, sans-serif" font-size="16" fill="#c4b5fd" text-anchor="middle">+21 more</text>

  <!-- Bottom stats -->
  <text x="80" y="538" font-family="Arial, sans-serif" font-size="20" fill="#6b7280">✓ Free forever</text>
  <text x="280" y="538" font-family="Arial, sans-serif" font-size="20" fill="#6b7280">✓ No signup needed</text>
  <text x="530" y="538" font-family="Arial, sans-serif" font-size="20" fill="#6b7280">✓ 50,000+ professionals</text>

  <!-- URL -->
  <text x="80" y="590" font-family="Arial, sans-serif" font-size="22" fill="#7c3aed" font-weight="600">formly.tools</text>
</svg>
